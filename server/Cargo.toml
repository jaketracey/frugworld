[package]
name = "frugworld-server"
version = "0.1.0"
edition = "2021"
description = "SpacetimeDB backend for Frugworld - a zone-of-influence AI simulator game"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = "1.0"
log = "0.4"

# For deterministic hashing in chunk generation
siphasher = "1.0"

# For serialization of payloads
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true

# Clippy lints configuration
[lints.rust]
unsafe_code = "warn"
# missing_docs = "warn"  # TODO: Enable once docs are complete

[lints.clippy]
# Warn - these should be addressed but allow initial development
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

# Warn - these should be addressed but not blocking
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
type_complexity = "warn"
cognitive_complexity = "warn"

# Style lints
clone_on_ref_ptr = "warn"
enum_glob_use = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_types_passed_by_value = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
map_flatten = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
match_on_vec_items = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
range_minus_one = "warn"
range_plus_one = "warn"
redundant_else = "warn"
ref_option_ref = "warn"
semicolon_if_nothing_returned = "warn"
string_add_assign = "warn"
trait_duplication_in_bounds = "warn"
trivially_copy_pass_by_ref = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
used_underscore_binding = "warn"
verbose_bit_mask = "warn"

# Pedantic (allow by default, enable selectively)
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
