<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frugworld</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700&family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-bg-dark: #0a0d14;
        --color-bg-panel: rgba(15, 20, 30, 0.9);
        --color-bg-panel-light: rgba(25, 35, 50, 0.85);
        --color-border: rgba(80, 120, 180, 0.3);
        --color-border-glow: rgba(100, 150, 220, 0.5);
        --color-accent: #4a9eff;
        --color-accent-glow: rgba(74, 158, 255, 0.4);
        --color-success: #4ade80;
        --color-warning: #fbbf24;
        --color-danger: #f87171;
        --color-text: #e2e8f0;
        --color-text-dim: #94a3b8;
        --color-text-muted: #64748b;
        /* New game colors */
        --color-purple: #8b5cf6;
        --color-purple-dark: #6d28d9;
        --color-purple-glow: rgba(139, 92, 246, 0.5);
        --color-gold: #fbbf24;
        --color-gold-glow: rgba(251, 191, 36, 0.5);
        --color-pink: #ec4899;
        --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-display: 'Fredoka', 'Orbitron', sans-serif;
        --font-game: 'Nunito', sans-serif;
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
        --radius-xl: 24px;
        --shadow-panel: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 1px rgba(255, 255, 255, 0.1) inset;
        --shadow-glow: 0 0 20px var(--color-accent-glow);
        --shadow-purple-glow: 0 0 30px var(--color-purple-glow);
        --shadow-gold-glow: 0 0 20px var(--color-gold-glow);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--color-bg-dark);
        font-family: var(--font-ui);
        color: var(--color-text);
      }

      #app {
        width: 100%;
        height: 100%;
      }

      canvas {
        display: block;
      }

      /* ========== Loading Screen ========== */
      #loading-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #1a1033 0%, #2d1b4e 30%, #1a1033 70%, #0f0a1f 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
        overflow: hidden;
      }

      #loading-screen::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 80% 50% at 50% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
          radial-gradient(ellipse 60% 40% at 70% 80%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
        pointer-events: none;
      }

      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loading-logo {
        font-family: 'Fredoka', var(--font-display);
        font-size: 72px;
        font-weight: 700;
        background: linear-gradient(135deg, #fbbf24 0%, #fcd34d 30%, #fbbf24 50%, #f59e0b 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 40px rgba(251, 191, 36, 0.6)) drop-shadow(0 4px 8px rgba(0, 0, 0, 0.5));
        letter-spacing: 6px;
        margin-bottom: 16px;
        animation: logoFloat 3s ease-in-out infinite;
        position: relative;
      }

      .loading-logo::after {
        content: '🌍';
        position: absolute;
        right: -60px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 48px;
        -webkit-text-fill-color: initial;
        animation: logoSpin 8s linear infinite;
      }

      @keyframes logoFloat {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      @keyframes logoSpin {
        from { transform: translateY(-50%) rotate(0deg); }
        to { transform: translateY(-50%) rotate(360deg); }
      }

      .loading-subtitle {
        font-family: 'Nunito', sans-serif;
        font-size: 18px;
        font-weight: 600;
        color: rgba(196, 181, 253, 0.8);
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-bottom: 48px;
      }

      .loading-spinner {
        width: 70px;
        height: 70px;
        border: 4px solid rgba(139, 92, 246, 0.2);
        border-top-color: var(--color-gold);
        border-right-color: var(--color-purple);
        border-radius: 50%;
        animation: spinGlow 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        margin-bottom: 28px;
        box-shadow:
          0 0 20px rgba(251, 191, 36, 0.3),
          inset 0 0 20px rgba(139, 92, 246, 0.1);
      }

      @keyframes spinGlow {
        to { transform: rotate(360deg); }
      }

      .loading-status {
        font-family: 'Nunito', sans-serif;
        font-size: 16px;
        font-weight: 600;
        color: rgba(196, 181, 253, 0.7);
        animation: statusPulse 2s ease-in-out infinite;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .loading-status::before {
        content: '✨';
        animation: sparkle 1s ease-in-out infinite;
      }

      @keyframes statusPulse {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); }
      }

      @keyframes sparkle {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.8); }
      }

      /* Loading screen decorative elements */
      .loading-stars {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .loading-star {
        position: absolute;
        width: 4px;
        height: 4px;
        background: white;
        border-radius: 50%;
        animation: twinkle 2s ease-in-out infinite;
      }

      @keyframes twinkle {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.2); }
      }

      /* ========== Top HUD Bar ========== */
      #hud-top {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        background: linear-gradient(to bottom, rgba(26, 16, 51, 0.9) 0%, transparent 100%);
        pointer-events: none;
        z-index: 100;
      }

      .hud-logo {
        font-family: 'Fredoka', var(--font-display);
        font-size: 24px;
        font-weight: 700;
        background: linear-gradient(135deg, #fbbf24 0%, #fcd34d 50%, #f59e0b 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.5)) drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
        letter-spacing: 4px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .hud-logo::before {
        content: '🌍';
        font-size: 22px;
        -webkit-text-fill-color: initial;
        animation: hudLogoSpin 12s linear infinite;
      }

      @keyframes hudLogoSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .hud-center {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .hud-right {
        display: flex;
        align-items: center;
        gap: 12px;
        pointer-events: auto;
      }

      /* ========== HUD Icon Buttons (unified style) ========== */
      .hud-icon-btn {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #2d1b4e 0%, #1a1033 100%);
        border: 3px solid var(--color-purple);
        border-radius: 16px;
        color: var(--color-gold);
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow:
          0 0 20px rgba(139, 92, 246, 0.3),
          0 4px 15px rgba(0, 0, 0, 0.4);
        font-size: 22px;
        position: relative;
      }

      .hud-icon-btn:hover {
        transform: scale(1.1) translateY(-2px);
        box-shadow:
          0 0 30px rgba(139, 92, 246, 0.5),
          0 8px 25px rgba(0, 0, 0, 0.5);
        border-color: #a78bfa;
      }

      .hud-icon-btn:active {
        transform: scale(0.95);
      }

      .hud-icon-btn svg {
        width: 24px;
        height: 24px;
        stroke: var(--color-gold);
        filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.5));
      }

      .hud-icon-btn .btn-label {
        display: none;
        position: absolute;
        bottom: -28px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Nunito', sans-serif;
        font-size: 11px;
        font-weight: 600;
        color: rgba(196, 181, 253, 0.8);
        white-space: nowrap;
        background: rgba(26, 16, 51, 0.9);
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid rgba(139, 92, 246, 0.3);
      }

      .hud-icon-btn:hover .btn-label {
        display: block;
      }

      /* ========== Connection Status (icon button style) ========== */
      #connection-status {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #2d1b4e 0%, #1a1033 100%);
        border: 3px solid var(--color-purple);
        border-radius: 16px;
        font-size: 20px;
        cursor: default;
        transition: all 0.3s ease;
        box-shadow:
          0 0 20px rgba(139, 92, 246, 0.3),
          0 4px 15px rgba(0, 0, 0, 0.4);
        position: relative;
      }

      #connection-status .status-text {
        display: none;
      }

      #connection-status .status-tooltip {
        display: none;
        position: absolute;
        bottom: -28px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Nunito', sans-serif;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        background: rgba(26, 16, 51, 0.9);
        padding: 4px 8px;
        border-radius: 6px;
        border: 1px solid rgba(139, 92, 246, 0.3);
      }

      #connection-status:hover .status-tooltip {
        display: block;
      }

      #connection-status::before {
        content: '📡';
        font-size: 22px;
      }

      #connection-status.connected {
        border-color: var(--color-success);
        box-shadow:
          0 0 20px rgba(74, 222, 128, 0.4),
          0 4px 15px rgba(0, 0, 0, 0.4);
      }

      #connection-status.connected::before {
        content: '🟢';
      }

      #connection-status.connected .status-tooltip {
        color: var(--color-success);
      }

      #connection-status.disconnected {
        border-color: var(--color-danger);
        box-shadow:
          0 0 20px rgba(248, 113, 113, 0.4),
          0 4px 15px rgba(0, 0, 0, 0.4);
      }

      #connection-status.disconnected::before {
        content: '🔴';
      }

      #connection-status.disconnected .status-tooltip {
        color: var(--color-danger);
      }

      #connection-status.connecting {
        border-color: var(--color-warning);
        box-shadow:
          0 0 20px rgba(251, 191, 36, 0.4),
          0 4px 15px rgba(0, 0, 0, 0.4);
        animation: connectingPulse 1.5s ease-in-out infinite;
      }

      #connection-status.connecting::before {
        content: '🟡';
        animation: connectingSpin 1s linear infinite;
      }

      #connection-status.connecting .status-tooltip {
        color: var(--color-warning);
      }

      @keyframes connectingPulse {
        0%, 100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.4), 0 4px 15px rgba(0, 0, 0, 0.4); }
        50% { box-shadow: 0 0 35px rgba(251, 191, 36, 0.6), 0 4px 15px rgba(0, 0, 0, 0.4); }
      }

      @keyframes connectingSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Legacy .hud-btn for backwards compatibility */
      .hud-btn {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #2d1b4e 0%, #1a1033 100%);
        border: 3px solid var(--color-purple);
        border-radius: 16px;
        color: var(--color-gold);
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow:
          0 0 20px rgba(139, 92, 246, 0.3),
          0 4px 15px rgba(0, 0, 0, 0.4);
      }

      .hud-btn:hover {
        transform: scale(1.1) translateY(-2px);
        box-shadow:
          0 0 30px rgba(139, 92, 246, 0.5),
          0 8px 25px rgba(0, 0, 0, 0.5);
        border-color: #a78bfa;
      }

      .hud-btn:active {
        transform: scale(0.95);
      }

      .hud-btn svg {
        width: 24px;
        height: 24px;
        stroke: var(--color-gold);
        filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.5));
      }

      /* ========== Minimap Controls ========== */
      #minimap-controls {
        position: fixed;
        top: 10px;
        right: 272px; /* 240px minimap + 20px gap + 12px spacing */
        display: flex;
        flex-direction: column;
        gap: 12px;
        z-index: 101;
      }

      /* ========== Minimap ========== */
      #minimap-container {
        position: fixed;
        top: 10px;
        right: 20px;
        width: 240px;
        height: 240px;
        background: linear-gradient(135deg, #2d1b4e 0%, #1a1033 100%);
        border: 3px solid var(--color-purple);
        border-radius: var(--radius-xl);
        overflow: hidden;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.3),
          0 0 30px rgba(139, 92, 246, 0.3),
          0 10px 40px rgba(0, 0, 0, 0.5);
        z-index: 101;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      #minimap-container:hover {
        transform: scale(1.02);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.3),
          0 0 40px rgba(139, 92, 246, 0.5),
          0 12px 50px rgba(0, 0, 0, 0.6);
      }

      #minimap-container.expanded {
        /* Scale to fit viewport with padding */
        --minimap-max-width: min(90vw, 800px);
        --minimap-max-height: min(85vh, 700px);
        width: var(--minimap-max-width);
        height: var(--minimap-max-height);
        top: 50%;
        left: 50%;
        right: auto;
        transform: translate(-50%, -50%);
        z-index: 1001;
      }

      #minimap-container.expanded:hover {
        transform: translate(-50%, -50%) scale(1);
      }

      .minimap-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: linear-gradient(90deg, rgba(139, 92, 246, 0.3) 0%, rgba(236, 72, 153, 0.2) 100%);
        border-bottom: 2px solid rgba(139, 92, 246, 0.4);
        position: relative;
      }

      .minimap-header::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      }

      .minimap-title {
        font-family: 'Fredoka', sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: var(--color-gold);
        text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .minimap-title::before {
        content: '🗺️';
        font-size: 16px;
      }

      .minimap-coords {
        font-family: 'Nunito', monospace;
        font-size: 12px;
        font-weight: 600;
        color: #c4b5fd;
        background: rgba(139, 92, 246, 0.2);
        padding: 4px 10px;
        border-radius: 12px;
        border: 1px solid rgba(139, 92, 246, 0.3);
      }

      .minimap-expand-hint {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Nunito', sans-serif;
        font-size: 10px;
        color: rgba(196, 181, 253, 0.5);
        opacity: 0;
        transition: opacity 0.2s;
      }

      #minimap-container:hover .minimap-expand-hint {
        opacity: 1;
      }

      #minimap-container.expanded .minimap-expand-hint {
        display: none;
      }

      .minimap-content {
        width: 100%;
        height: calc(100% - 45px);
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
        position: relative;
      }

      .minimap-placeholder {
        font-size: 11px;
        color: var(--color-text-muted);
      }

      .minimap-player {
        width: 12px;
        height: 12px;
        background: linear-gradient(135deg, var(--color-gold), #f59e0b);
        border-radius: 50%;
        box-shadow: 0 0 15px rgba(251, 191, 36, 0.6);
        animation: playerPulse 2s ease-in-out infinite;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }

      @keyframes playerPulse {
        0%, 100% { box-shadow: 0 0 15px rgba(251, 191, 36, 0.6); transform: scale(1); }
        50% { box-shadow: 0 0 25px rgba(251, 191, 36, 0.8), 0 0 40px rgba(251, 191, 36, 0.4); transform: scale(1.1); }
      }

      /* Minimap Legend (visible when expanded) */
      .minimap-legend {
        display: none;
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 12px 16px;
        background: linear-gradient(0deg, rgba(26, 16, 51, 0.95) 0%, rgba(26, 16, 51, 0.8) 100%);
        border-top: 2px solid rgba(139, 92, 246, 0.3);
      }

      #minimap-container.expanded .minimap-legend {
        display: block;
      }

      .minimap-legend-title {
        font-family: 'Fredoka', sans-serif;
        font-size: 12px;
        font-weight: 600;
        color: var(--color-gold);
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .minimap-legend-items {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .minimap-legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'Nunito', sans-serif;
        font-size: 11px;
        color: rgba(196, 181, 253, 0.8);
      }

      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
      }

      .legend-dot.player {
        background: linear-gradient(135deg, var(--color-gold), #f59e0b);
        box-shadow: 0 0 8px rgba(251, 191, 36, 0.5);
      }

      .legend-dot.other-player {
        background: linear-gradient(135deg, #4ade80, #22c55e);
        box-shadow: 0 0 8px rgba(74, 222, 128, 0.5);
      }

      .legend-dot.npc {
        background: linear-gradient(135deg, #a78bfa, #8b5cf6);
        box-shadow: 0 0 8px rgba(167, 139, 250, 0.5);
      }

      .legend-dot.poi {
        background: linear-gradient(135deg, #f472b6, #ec4899);
        box-shadow: 0 0 8px rgba(244, 114, 182, 0.5);
      }

      .legend-square {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        flex-shrink: 0;
      }

      .legend-square.plains {
        background: #86efac;
      }

      .legend-square.forest {
        background: #22c55e;
      }

      .legend-square.water {
        background: #60a5fa;
      }

      .legend-square.mountain {
        background: #a1a1aa;
      }

      /* Minimap close button (visible when expanded) */
      .minimap-close {
        display: none;
        position: absolute;
        top: 10px;
        right: 10px;
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, #ef4444, #dc2626);
        border: 2px solid #fca5a5;
        border-radius: 10px;
        color: white;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
        z-index: 10;
      }

      #minimap-container.expanded .minimap-close {
        display: flex;
      }

      .minimap-close:hover {
        transform: scale(1.1) rotate(90deg);
        box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
      }

      /* Minimap overlay when expanded */
      .minimap-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(4px);
        z-index: 1000;
      }

      .minimap-overlay.visible {
        display: block;
      }

      /* ========== Frug HUD (Bottom Center) ========== */
      #frug-hud {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 100;
        pointer-events: none;
      }

      .frug-hud-content {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      .frug-character {
        width: 225px;
        height: 225px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
        border-radius: 50%;
      }

      #frug-canvas {
        image-rendering: auto;
      }

      .frug-stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 14px 12px;
        background: linear-gradient(135deg, #2d1b4e 0%, #1a1033 100%);
        border: 2px solid var(--color-purple);
        border-radius: var(--radius-lg);
        backdrop-filter: blur(8px);
        min-width: 54px;
        box-shadow:
          0 0 20px rgba(139, 92, 246, 0.2),
          0 4px 15px rgba(0, 0, 0, 0.4);
        transition: all 0.2s ease;
      }

      .frug-stat:hover {
        transform: translateY(-2px);
        box-shadow:
          0 0 25px rgba(139, 92, 246, 0.3),
          0 6px 20px rgba(0, 0, 0, 0.5);
        border-color: #a78bfa;
      }

      .frug-stat-bar {
        width: 10px;
        height: 80px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 5px;
        overflow: hidden;
        position: relative;
        border: 1px solid rgba(139, 92, 246, 0.3);
      }

      .frug-stat-fill {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        border-radius: 4px;
        transition: height 0.3s ease;
      }

      .frug-stat-fill.health {
        background: linear-gradient(to top, #8b5cf6, #a78bfa);
        box-shadow: 0 0 12px rgba(139, 92, 246, 0.6);
      }

      .frug-stat-fill.energy {
        background: linear-gradient(to top, #f59e0b, #fbbf24);
        box-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
      }

      .frug-stat-icon {
        font-size: 18px;
        filter: drop-shadow(0 0 4px currentColor);
      }

      .frug-stat-value {
        font-family: 'Nunito', sans-serif;
        font-size: 12px;
        font-weight: 700;
        color: rgba(196, 181, 253, 0.9);
        background: rgba(139, 92, 246, 0.15);
        padding: 2px 6px;
        border-radius: 6px;
      }

      .frug-health .frug-stat-icon {
        color: #a78bfa;
      }

      .frug-energy .frug-stat-icon {
        color: #fbbf24;
      }

      /* Frug Character Styles - 1.5x size */
      .frug-body {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #6cd97e 0%, #44bb66 50%, #2d9450 100%);
        position: relative;
        box-shadow:
          inset -12px -12px 30px rgba(0, 0, 0, 0.2),
          inset 12px 12px 30px rgba(255, 255, 255, 0.1),
          0 12px 36px rgba(0, 0, 0, 0.3);
        border: 3px solid #228844;
      }

      .frug-stripe {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 85%;
        height: 12%;
        background: linear-gradient(to bottom, #2a7d4a, #227744, #2a7d4a);
        border-radius: 50%;
      }

      .frug-highlight {
        position: absolute;
        top: 15%;
        left: 20%;
        width: 30%;
        height: 30%;
        background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
        border-radius: 50%;
      }

      .frug-highlight-small {
        position: absolute;
        top: 10%;
        left: 35%;
        width: 12%;
        height: 12%;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 50%;
      }

      .frug-face {
        position: absolute;
        top: 25%;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 30px;
      }

      .frug-eye {
        width: 33px;
        height: 33px;
        background: white;
        border-radius: 50%;
        position: relative;
        box-shadow:
          inset 0 3px 6px rgba(0, 0, 0, 0.1),
          0 2px 3px rgba(0, 0, 0, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .frug-pupil {
        width: 18px;
        height: 18px;
        background: radial-gradient(circle at 30% 30%, #333 0%, #111 100%);
        border-radius: 50%;
        position: relative;
      }

      .frug-pupil::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 6px;
        height: 6px;
        background: white;
        border-radius: 50%;
      }

      /* ========== Custom Cursor ========== */
      #custom-cursor {
        position: fixed;
        width: 40px;
        height: 40px;
        pointer-events: none;
        z-index: 9998;
        transform: translate(-50%, -50%);
        transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
      }

      #custom-cursor::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 12px;
        height: 12px;
        background: white;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 0 0 24px rgba(255, 255, 255, 0.4);
        transition: width 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
                    height 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
                    box-shadow 0.15s ease;
      }

      #custom-cursor::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 32px;
        height: 32px;
        border: 2px solid rgba(255, 255, 255, 0.6);
        border-radius: 50%;
        transform: translate(-50%, -50%);
        opacity: 0.5;
        animation: cursor-pulse 2.5s ease-in-out infinite;
        transition: width 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                    height 0.2s cubic-bezier(0.34, 1.56, 0.64, 1),
                    opacity 0.15s ease,
                    border-color 0.15s ease;
      }

      @keyframes cursor-pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
        50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.25; }
      }

      /* Click animation - squish and burst */
      #custom-cursor.clicking {
        transform: translate(-50%, -50%) scale(0.85);
      }

      #custom-cursor.clicking::before {
        width: 16px;
        height: 16px;
        box-shadow: 0 0 20px rgba(255, 255, 255, 1), 0 0 40px rgba(255, 255, 255, 0.6);
      }

      #custom-cursor.clicking::after {
        animation: cursor-click-burst 0.3s ease-out forwards;
        border-color: rgba(255, 255, 255, 0.9);
      }

      @keyframes cursor-click-burst {
        0% {
          transform: translate(-50%, -50%) scale(0.8);
          opacity: 1;
          border-width: 3px;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.4);
          opacity: 0.6;
          border-width: 2px;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.8);
          opacity: 0;
          border-width: 1px;
        }
      }

      /* Ripple effect element */
      .cursor-ripple {
        position: fixed;
        pointer-events: none;
        z-index: 9997;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.4) 0%, transparent 70%);
        transform: translate(-50%, -50%);
        animation: ripple-expand 0.5s ease-out forwards;
      }

      @keyframes ripple-expand {
        0% {
          width: 20px;
          height: 20px;
          opacity: 0.6;
        }
        100% {
          width: 80px;
          height: 80px;
          opacity: 0;
        }
      }

      html, body, canvas, #app {
        cursor: none !important;
      }

      /* Restore cursor for interactive UI elements */
      button, input, select, textarea, a, [onclick], .settings-btn, .hud-button {
        cursor: none !important;
      }

      /* ========== Debug Overlay ========== */
      #debug-overlay {
        position: fixed;
        top: 70px;
        left: 20px;
        background: var(--color-bg-panel);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        padding: 12px 16px;
        font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
        font-size: 11px;
        line-height: 1.6;
        color: var(--color-text-dim);
        backdrop-filter: blur(8px);
        pointer-events: none;
        z-index: 100;
        max-width: 280px;
      }

      #debug-overlay .debug-title {
        font-weight: 600;
        color: var(--color-accent);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 10px;
      }

      #debug-overlay .debug-row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }

      #debug-overlay .debug-label {
        color: var(--color-text-muted);
      }

      #debug-overlay .debug-value {
        color: var(--color-text);
        font-weight: 500;
      }

      #debug-overlay .debug-value.highlight {
        color: var(--color-accent);
      }

      /* ========== Notification Toast ========== */
      #notifications {
        position: fixed;
        top: 80px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 1000;
        pointer-events: none;
      }

      .notification {
        padding: 12px 20px;
        background: var(--color-bg-panel);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        font-size: 14px;
        color: var(--color-text);
        backdrop-filter: blur(12px);
        box-shadow: var(--shadow-panel);
        animation: notifySlide 0.3s ease;
        white-space: nowrap;
      }

      .notification.success {
        border-color: rgba(74, 222, 128, 0.4);
        background: rgba(74, 222, 128, 0.1);
      }

      .notification.warning {
        border-color: rgba(251, 191, 36, 0.4);
        background: rgba(251, 191, 36, 0.1);
      }

      .notification.error {
        border-color: rgba(248, 113, 113, 0.4);
        background: rgba(248, 113, 113, 0.1);
      }

      @keyframes notifySlide {
        from { opacity: 0; transform: translateY(-20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* ========== Welcome Message ========== */
      #welcome-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        z-index: 1000;
        pointer-events: none;
      }

      #welcome-message {
        font-family: 'Fredoka', var(--font-display);
        font-size: 64px;
        font-weight: 700;
        color: white;
        text-shadow: 0 0 40px rgba(255, 255, 255, 0.5), 0 4px 8px rgba(0, 0, 0, 0.5);
        letter-spacing: 4px;
        opacity: 0;
        animation: welcomeSlideUp 5s ease-in-out forwards;
      }

      #frug-status {
        font-family: 'Fredoka', var(--font-display);
        font-size: 24px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.85);
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.3), 0 2px 4px rgba(0, 0, 0, 0.5);
        opacity: 0;
        animation: statusFadeIn 5s ease-in-out forwards;
      }

      @keyframes welcomeSlideUp {
        0% { opacity: 0; transform: translateY(20px); }
        15% { opacity: 1; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(0); }
        70% { opacity: 1; transform: translateY(-30px); }
        100% { opacity: 0; transform: translateY(-30px); }
      }

      @keyframes statusFadeIn {
        0% { opacity: 0; }
        30% { opacity: 0; }
        50% { opacity: 1; }
        70% { opacity: 1; }
        100% { opacity: 0; }
      }

      /* ========== Regenerate Seed Button ========== */
      #regenerate-seed-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 20px;
        background: linear-gradient(135deg, #2d1b4e 0%, #1a1033 100%);
        border: 3px solid var(--color-purple);
        border-radius: var(--radius-xl);
        cursor: pointer;
        z-index: 100;
        font-family: 'Fredoka', sans-serif;
        font-size: 14px;
        font-weight: 600;
        color: var(--color-gold);
        text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.3),
          0 0 30px rgba(139, 92, 246, 0.3),
          0 10px 40px rgba(0, 0, 0, 0.5);
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        pointer-events: auto;
      }

      #regenerate-seed-btn:hover {
        transform: scale(1.05) translateY(-2px);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.3),
          0 0 40px rgba(139, 92, 246, 0.5),
          0 12px 50px rgba(0, 0, 0, 0.6);
        border-color: #a78bfa;
      }

      #regenerate-seed-btn:active {
        transform: scale(0.98);
      }

      #regenerate-seed-btn .btn-icon {
        font-size: 20px;
        animation: seedSpin 3s linear infinite paused;
      }

      #regenerate-seed-btn:hover .btn-icon {
        animation-play-state: running;
      }

      @keyframes seedSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      #regenerate-seed-btn .btn-text {
        letter-spacing: 1px;
      }

      /* ========== Ambient Effects ========== */
      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.4) 100%);
        z-index: 10;
      }

    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loading-stars" id="loading-stars"></div>
      <div class="loading-logo">FRUGWORLD</div>
      <div class="loading-subtitle">Adventure Awaits</div>
      <div class="loading-spinner"></div>
      <div class="loading-status">Initializing world...</div>
    </div>

    <script>
      // Generate random stars for loading screen
      (function() {
        const starsContainer = document.getElementById('loading-stars');
        if (starsContainer) {
          for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'loading-star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            star.style.width = (2 + Math.random() * 3) + 'px';
            star.style.height = star.style.width;
            starsContainer.appendChild(star);
          }
        }
      })();
    </script>

    <!-- Main Game Container -->
    <div id="app"></div>

    <!-- Ambient Effects -->
    <div class="vignette"></div>

    <!-- Top HUD -->
    <div id="hud-top">
      <div class="hud-logo">FRUGWORLD</div>
      <div class="hud-center"></div>
      <div class="hud-right"></div>
    </div>

    <!-- Minimap Controls (positioned left of minimap) -->
    <div id="minimap-controls">
      <div id="connection-status" class="disconnected">
        <span class="status-text">Disconnected</span>
        <span class="status-tooltip">Disconnected</span>
      </div>
      <button class="hud-icon-btn" id="settings-btn" title="Settings">
        ⚙️
        <span class="btn-label">Settings</span>
      </button>
    </div>

    <!-- Minimap Overlay (for expanded state) -->
    <div class="minimap-overlay" id="minimap-overlay"></div>

    <!-- Minimap -->
    <div id="minimap-container">
      <button class="minimap-close" id="minimap-close" type="button">×</button>
      <div class="minimap-header">
        <span class="minimap-title">World Map</span>
        <span class="minimap-coords" id="minimap-coords">0, 0</span>
      </div>
      <div class="minimap-content">
        <div class="minimap-player"></div>
        <div class="minimap-expand-hint">Click to expand</div>
      </div>
      <div class="minimap-legend">
        <div class="minimap-legend-title">Legend</div>
        <div class="minimap-legend-items">
          <div class="minimap-legend-item">
            <div class="legend-dot player"></div>
            <span>You</span>
          </div>
          <div class="minimap-legend-item">
            <div class="legend-dot other-player"></div>
            <span>Other Players</span>
          </div>
          <div class="minimap-legend-item">
            <div class="legend-dot npc"></div>
            <span>NPCs</span>
          </div>
          <div class="minimap-legend-item">
            <div class="legend-dot poi"></div>
            <span>Points of Interest</span>
          </div>
          <div class="minimap-legend-item">
            <div class="legend-square plains"></div>
            <span>Plains</span>
          </div>
          <div class="minimap-legend-item">
            <div class="legend-square forest"></div>
            <span>Forest</span>
          </div>
          <div class="minimap-legend-item">
            <div class="legend-square water"></div>
            <span>Water</span>
          </div>
          <div class="minimap-legend-item">
            <div class="legend-square mountain"></div>
            <span>Mountains</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Frug HUD is dynamically created by FrugHUD.ts -->

    <!-- Custom Cursor -->
    <div id="custom-cursor"></div>

    <!-- Debug Overlay -->
    <div id="debug-overlay"></div>

    <!-- Notifications -->
    <div id="notifications"></div>

    <!-- Regenerate Seed Button -->
    <button id="regenerate-seed-btn" type="button">
      <span class="btn-icon">🌍</span>
      <span class="btn-text">New World</span>
    </button>

    <script>
      // Custom cursor tracking
      (function() {
        const cursor = document.getElementById('custom-cursor');
        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;

        document.addEventListener('mousemove', (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
        });

        // Create ripple effect on click
        function createRipple(x, y) {
          const ripple = document.createElement('div');
          ripple.className = 'cursor-ripple';
          ripple.style.left = x + 'px';
          ripple.style.top = y + 'px';
          document.body.appendChild(ripple);

          // Remove ripple after animation
          ripple.addEventListener('animationend', () => {
            ripple.remove();
          });
        }

        document.addEventListener('mousedown', (e) => {
          cursor.classList.add('clicking');
          // Spawn ripple at click position
          createRipple(e.clientX, e.clientY);
        });

        document.addEventListener('mouseup', () => {
          cursor.classList.remove('clicking');
        });

        // Smooth cursor animation (snappier response)
        function animateCursor() {
          cursorX += (mouseX - cursorX) * 0.2;
          cursorY += (mouseY - cursorY) * 0.2;
          cursor.style.left = cursorX + 'px';
          cursor.style.top = cursorY + 'px';
          requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Hide cursor when mouse leaves window
        document.addEventListener('mouseleave', () => {
          cursor.style.opacity = '0';
        });
        document.addEventListener('mouseenter', () => {
          cursor.style.opacity = '1';
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
