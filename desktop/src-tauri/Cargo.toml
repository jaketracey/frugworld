[package]
name = "frugworld-desktop"
version = "0.1.0"
description = "Frugworld Desktop Application"
authors = ["Frugworld Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["process", "fs", "rt-multi-thread", "time", "sync"] }
dirs = "5.0"
thiserror = "1.0"
reqwest = { version = "0.12", features = ["json"] }
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
